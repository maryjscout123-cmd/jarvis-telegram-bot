name: Keep Render bot awake
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          for i in $(seq 1 3); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://jarvis-telegram-bot-z9hh.onrender.com/ || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "502" ] || [ "$code" = "503" ]; then
              exit 0
            fi
            sleep 20
          done
